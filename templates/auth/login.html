{% extends 'base.html' %}
{% block title %}Staff Login{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <i class="bi bi-hospital display-4 text-primary"></i>
                    <h2 class="mt-2">Staff Login</h2>
                    <p class="text-muted">MediTask — Hospital Task Management</p>
                </div>

                <form method="POST" action="{% url 'login' %}">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="username" class="form-label fw-semibold">Username</label>
                        <input type="text" name="username" id="username"
                               class="form-control" placeholder="Enter your username"
                               autocomplete="username" required>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label fw-semibold">Password</label>
                        <input type="password" name="password" id="password"
                               class="form-control" placeholder="Enter your password"
                               autocomplete="current-password" required>
                    </div>

                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary btn-lg">Login</button>
                    </div>
                </form>

                <hr>
                <p class="text-center text-muted mb-0">
                    New staff member? <a href="{% url 'register' %}">Register here</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
