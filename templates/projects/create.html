{% extends 'base.html' %}
{% block title %}Create Project{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white">
                <h4 class="mb-0"><i class="bi bi-folder-plus"></i> Create New Project</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{% url 'project_create' %}">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="name" class="form-label fw-semibold">Name</label>
                        <input type="text" name="name" id="name"
                               class="form-control" placeholder="e.g. Ward A — General Medicine" required>
                    </div>

                    <div class="mb-3">
                        <label for="description" class="form-label fw-semibold">Description</label>
                        <textarea name="description" id="description"
                                  class="form-control" rows="3"
                                  placeholder="Brief description of this ward or department"></textarea>
                    </div>

                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-primary">Save Project</button>
                        <a href="{% url 'project_list' %}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
